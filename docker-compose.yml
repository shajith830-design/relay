services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    image: relay-automation:latest
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the Supabase PostgreSQL pooler URL}
      INQUIRIES_API_TOKEN: ${INQUIRIES_API_TOKEN:?Set a strong INQUIRIES_API_TOKEN}
      OWNER_ADMIN_TOKEN: ${OWNER_ADMIN_TOKEN:?Set a strong OWNER_ADMIN_TOKEN}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY for password recovery}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:?Set a verified AUTH_EMAIL_FROM address}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set the public HTTPS URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      INQUIRY_NOTIFICATION_EMAIL: ${INQUIRY_NOTIFICATION_EMAIL:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
