services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    image: relay-automation:latest
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      DATABASE_PATH: /app/data/relay.db
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?Set TELEGRAM_CHAT_ID}
      INQUIRIES_API_TOKEN: ${INQUIRIES_API_TOKEN:?Set a strong INQUIRIES_API_TOKEN}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY for password recovery}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:?Set a verified AUTH_EMAIL_FROM address}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set the public HTTPS URL}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set the AI service API key for Relay Help}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - relay-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  relay-data:
